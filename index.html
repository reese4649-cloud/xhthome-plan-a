    const LOGO_URL = "./assets/images/logo-transparent.png";

    // Global Header Component
    function Header({ isMobile = false }) {
      const location = useLocation();
      const currentPath = location.pathname;
      const [isScrolled, setIsScrolled] = useState(false);
      const isTransparent = currentPath === '/' && !isScrolled;

      useEffect(() => {
        const handleScroll = () => setIsScrolled(window.scrollY > 24);
        handleScroll();
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <header className={`fixed top-0 left-0 w-full z-50 transition-all duration-300 ${
          isTransparent
            ? 'bg-transparent border-b border-transparent shadow-none'
            : 'bg-surface/95 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.05)] border-b border-surface-container'
        }`}>

              <div className="flex flex-col justify-center pl-2">
                <span className={`font-headline-sm text-headline-sm tracking-wide leading-none font-medium transition-colors ${isTransparent ? 'text-white' : 'text-primary'}`}>馨恒泰家居</span>
                <span className={`font-label-sm text-label-sm tracking-widest uppercase scale-90 origin-left mt-1 transition-colors ${isTransparent ? 'text-white/75' : 'text-secondary'}`}>Xinhengtai Home Living</span>

                    currentPath === '/'
                      ? isTransparent ? 'text-white font-medium border-b-2 border-white' : 'text-primary font-medium border-b-2 border-primary'
                      : isTransparent ? 'text-white/85 hover:text-white' : 'text-on-surface-variant hover:text-on-surface'
                  }`}
                >
                  首页
                </Link>
                <Link
                  to="/about-us"
                  className={`font-body-md text-body-md transition-colors py-1 ${
                    currentPath === '/about-us'
                      ? 'text-primary font-medium border-b-2 border-primary'
                      : isTransparent ? 'text-white/85 hover:text-white' : 'text-on-surface-variant hover:text-on-surface'
                  }`}
                >
                  关于我们
                </Link>
                <Link
                  to="/join-us"
                  className={`font-body-md text-body-md transition-colors py-1 px-4 rounded-full border ${
                    currentPath === '/join-us' 
                      ? 'bg-primary text-on-primary border-primary font-medium' 
                      : isTransparent
                        ? 'bg-white/10 border-white/50 text-white hover:bg-white hover:text-primary'
                        : 'bg-primary-container/10 border-primary-container/20 text-primary hover:bg-primary-container hover:text-on-primary'
                  }`}

                  加入我们
                </Link>
                <Link
                  to="/contact-us"
                  className={`font-body-md text-body-md transition-colors py-1 ${
                    currentPath === '/contact-us'
                      ? 'text-primary font-medium border-b-2 border-primary'
                      : isTransparent ? 'text-white/85 hover:text-white' : 'text-on-surface-variant hover:text-on-surface'
                  }`}
                >
                  联系我们
                </Link>
              </nav>

                  to="/mobile"

              </div>

    // Shared mobile navigation: top bar trigger + left drawer
    function MobileDrawerMenu({ transparent = false }) {
      const location = useLocation();
      const [isOpen, setIsOpen] = useState(false);

      const menuItems = [
        { label: '首页', to: '/mobile', paths: ['/', '/mobile'], icon: 'home' },
        { label: '关于我们', to: '/about-us', paths: ['/about-us'], icon: 'corporate_fare' },
        { label: '加入我们', to: '/mobile-join', paths: ['/join-us', '/mobile-join'], icon: 'group_add' },
        { label: '联系我们', to: '/contact-us', paths: ['/contact-us'], icon: 'mail' }
      ];

      useEffect(() => {
        setIsOpen(false);
      }, [location.pathname]);

      useEffect(() => {
        if (!isOpen) return;
        const previousOverflow = document.body.style.overflow;
        const handleKeyDown = (event) => {
          if (event.key === 'Escape') setIsOpen(false);
        };
        document.body.style.overflow = 'hidden';
        window.addEventListener('keydown', handleKeyDown);
        return () => {
          document.body.style.overflow = previousOverflow;
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, [isOpen]);

      return (
        <React.Fragment>
          <button
            type="button"
            className={`w-11 h-11 inline-flex items-center justify-center rounded-lg border transition-colors ${
              transparent
                ? 'border-white/35 bg-black/10 text-white hover:bg-white/15'
                : 'border-outline-variant/50 bg-surface-container-low text-primary hover:bg-surface-container'
            }`}
            aria-label="打开导航菜单"
            aria-expanded={isOpen}
            onClick={() => setIsOpen(true)}
          >
            <span className="material-symbols-outlined text-[24px]">menu</span>
          </button>

          {createPortal(
            <div className={`fixed inset-0 z-[60] md:hidden ${isOpen ? 'pointer-events-auto visible' : 'pointer-events-none invisible delay-300'}`} aria-hidden={!isOpen}>
              <button
                type="button"
                className={`absolute inset-0 w-full h-full bg-black/45 backdrop-blur-[2px] transition-opacity duration-300 ${isOpen ? 'opacity-100' : 'opacity-0'}`}
                aria-label="关闭导航菜单"
                onClick={() => setIsOpen(false)}
              ></button>

              <aside
                className={`absolute inset-y-0 left-0 w-[82vw] max-w-[320px] bg-surface shadow-2xl transition-transform duration-300 ease-out ${isOpen ? 'translate-x-0' : '-translate-x-full'}`}
                role="dialog"
                aria-modal="true"
                aria-label="网站导航"
              >
                <div className="h-full flex flex-col">
                  <div className="h-20 px-5 flex items-center justify-between border-b border-surface-container-highest">
                    <Link to="/mobile" className="flex items-center gap-3 min-w-0">
                      <img alt="馨恒泰家居 logo" className="h-8 w-auto object-contain" src={LOGO_URL} />
                      <div className="flex flex-col min-w-0">
                        <span className="font-label-lg text-label-lg text-primary font-medium truncate">馨恒泰家居</span>
                        <span className="font-label-sm text-label-sm text-secondary tracking-widest uppercase truncate">Xinhengtai</span>
                      </div>
                    </Link>
                    <button
                      type="button"
                      className="w-10 h-10 inline-flex items-center justify-center rounded-lg text-on-surface-variant hover:text-primary hover:bg-surface-container transition-colors"
                      aria-label="关闭导航菜单"
                      onClick={() => setIsOpen(false)}
                    >
                      <span className="material-symbols-outlined text-[24px]">close</span>
                    </button>
                  </div>

                  <nav className="flex-1 px-5 py-8" aria-label="移动端导航">
                    <div className="flex flex-col gap-2">
                      {menuItems.map((item) => {
                        const active = item.paths.includes(location.pathname);
                        return (
                          <Link
                            key={item.label}
                            to={item.to}
                            className={`min-h-[52px] px-4 rounded-lg flex items-center justify-between transition-colors ${
                              active
                                ? 'bg-primary text-on-primary font-medium'
                                : 'text-on-surface-variant hover:text-primary hover:bg-surface-container-low'
                            }`}
                          >
                            <span className="flex items-center gap-3">
                              <span className="material-symbols-outlined text-[21px]">{item.icon}</span>
                              <span className="font-body-md text-body-md">{item.label}</span>
                            </span>
                            <span className="material-symbols-outlined text-[18px]">chevron_right</span>
                          </Link>
                        );
                      })}
                    </div>
                  </nav>

                  <div className="px-5 py-6 border-t border-surface-container-highest">
                    <p className="font-label-sm text-label-sm text-outline tracking-wider">上海馨恒泰家居有限公司</p>
                  </div>
                </div>
              </aside>
            </div>,
            document.body
          )}
        </React.Fragment>
      );
    }

          <div className="h-16 px-margin-mobile flex items-center justify-between gap-space-xs">

                      <button className="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-primary" type="button">
                        <span className={`material-symbols-outlined text-[20px] transition-transform ${openJobs[1] ? '' : 'rotate-180'}`}>expand_less</span>
                      </button>
                    </div>
                    <p className="font-body-sm text-body-sm text-on-surface-variant">
                      聚焦欧美海外高端实木家居陈列与自主品牌出海拓展。
                    </p>
                  </div>

                  {openJobs[1] && (
                    <div className="px-space-md pb-space-md flex flex-col gap-space-md border-t border-surface-container pt-3">
                      <div className="flex flex-col gap-space-xs">
                        <div className="flex items-center gap-1.5">
                          <span className="w-1.5 h-1.5 rounded-full bg-primary"></span>
                          <h3 className="font-label-lg text-label-lg text-primary font-medium">核心职责 (Key Duties)</h3>
                        </div>
                        <ul className="flex flex-col gap-2 font-body-sm text-body-sm text-on-surface-variant pl-3">
                          <li className="flex items-start gap-2"><span className="text-secondary font-label-md text-label-md">01</span><span>负责品牌独立站及主流国际电商平台的家居品类全周期运营与选品策略。</span></li>
                          <li className="flex items-start gap-2"><span className="text-secondary font-label-md text-label-md">02</span><span>深挖欧美木作文化与居家偏好，协同产品团队进行本地化改良与卖点塑造。</span></li>
                          <li className="flex items-start gap-2"><span className="text-secondary font-label-md text-label-md">03</span><span>制定高转化视觉陈列方案，把控实木美学视觉基调与海外传播质感。</span></li>
                          <li className="flex items-start gap-2"><span className="text-secondary font-label-md text-label-md">04</span><span>追踪全链路销售数据、复购画像与海外仓周转，持续优化单品 ROI。</span></li>
                        </ul>
                      </div>
                      <div className="flex flex-col gap-space-xs">
                        <div className="flex items-center gap-1.5">
                          <span className="w-1.5 h-1.5 rounded-full bg-secondary"></span>
                          <h3 className="font-label-lg text-label-lg text-primary font-medium">任职资格 (Qualifications)</h3>
                        </div>
                        <ul className="flex flex-col gap-2 font-body-sm text-body-sm text-on-surface-variant pl-3">
                          <li className="flex items-start gap-2"><span className="text-secondary font-label-md text-label-md">01</span><span>本科及以上学历，3年以上家居、高客单价生活方式出海运营操盘经验。</span></li>
                          <li className="flex items-start gap-2"><span className="text-secondary font-label-md text-label-md">02</span><span>熟悉大件家具物流、海外仓仓配流程与售后闭环逻辑。</span></li>
                          <li className="flex items-start gap-2"><span className="text-secondary font-label-md text-label-md">03</span><span>英语可作为工作语言，具备跨文化商业敏感度与审美鉴赏能力。</span></li>
                        </ul>
                      </div>
                      <div className="pt-space-xs flex flex-col gap-2">
                        <button
                          className="w-full py-3 px-space-md rounded-lg bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-sm active:opacity-90"
                          onClick={() => showChannelNotice('跨境电商运营专家')}
                          type="button"
                        >
                          <span className="material-symbols-outlined text-[18px]">forward_to_inbox</span>
                          <span>申请该岗位意向</span>
                        </button>
                        <div className="p-2 rounded bg-surface-container-low text-on-surface-variant text-center font-label-sm text-label-sm">
                          注：投递渠道待官方正式开放，本站暂不提供在线简历上传服务
                        </div>
                      </div>
                    </div>
                  )}
                </article>
              )}

              {/* Mobile Job 2 */}
              {(filter === 'all' || filter === 'social') && (
                <article className="job-card rounded-xl bg-surface-container-lowest shadow-sm flex flex-col overflow-hidden">
                  <div className="p-space-md flex flex-col gap-space-xs cursor-pointer" onClick={() => toggleDetails(2)}>
                    <div className="flex items-start justify-between gap-space-xs">
                      <div className="flex flex-wrap items-center gap-1.5">
                        <span className="px-2 py-0.5 rounded font-label-sm text-label-sm bg-surface-container text-primary font-medium">研发部</span>
                        <span className="px-2 py-0.5 rounded font-label-sm text-label-sm bg-surface-container text-on-surface-variant">全职</span>
                      </div>
                      <span className="font-label-sm text-label-sm text-secondary flex items-center gap-0.5">
                        <span className="material-symbols-outlined text-[14px]">location_on</span>
                        上海青浦
                      </span>
                    </div>
                    <div className="flex items-center justify-between pt-1">
                      <h2 className="font-headline-sm text-headline-sm text-primary font-medium tracking-tight">家居产品研发设计师</h2>
                      <button className="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-primary" type="button">
                        <span className={`material-symbols-outlined text-[20px] transition-transform ${openJobs[2] ? '' : 'rotate-180'}`}>expand_less</span>
                      </button>
                    </div>
                    <p className="font-body-sm text-body-sm text-on-surface-variant">
                      深耕现代榫卯结构、人体工学校准与原木自然质感的结构设计。
                    </p>
                  </div>

                  {openJobs[2] && (
                    <div className="px-space-md pb-space-md flex flex-col gap-space-md border-t border-surface-container pt-3">
                      <div className="flex flex-col gap-space-xs">
                        <div className="flex items-center gap-1.5">
                          <span className="w-1.5 h-1.5 rounded-full bg-primary"></span>
                          <h3 className="font-label-lg text-label-lg text-primary font-medium">核心职责概览</h3>
                        </div>
                        <ul className="flex flex-col gap-2 font-body-sm text-body-sm text-on-surface-variant pl-3">
                          <li className="flex items-start gap-2"><span className="text-secondary font-label-md text-label-md">01</span><span>主导实木套房原创系列的外观与结构深化设计。</span></li>
                          <li className="flex items-start gap-2"><span className="text-secondary font-label-md text-label-md">02</span><span>打通打样车间与工艺师傅，跟进试制打样与量产验收。</span></li>
                        </ul>
                      </div>
                      <div className="pt-space-xs flex flex-col gap-2">
                        <button
                          className="w-full py-3 px-space-md rounded-lg bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-sm"
                          onClick={() => showChannelNotice('家居产品研发设计师')}
                          type="button"
                        >
                          <span className="material-symbols-outlined text-[18px]">forward_to_inbox</span>
                          <span>申请该岗位意向</span>
                        </button>
                      </div>
                    </div>
                  )}
                </article>
              )}

              {/* Mobile Job 3 */}
              {(filter === 'all' || filter === 'campus') && (
                <article className="job-card rounded-xl bg-surface-container-lowest shadow-sm flex flex-col overflow-hidden">
                  <div className="p-space-md flex flex-col gap-space-xs cursor-pointer" onClick={() => toggleDetails(3)}>
                    <div className="flex items-start justify-between gap-space-xs">
                      <div className="flex flex-wrap items-center gap-1.5">
                        <span className="px-2 py-0.5 rounded font-label-sm text-label-sm bg-tertiary-fixed text-on-tertiary-fixed font-medium">管培计划</span>
                        <span className="px-2 py-0.5 rounded font-label-sm text-label-sm bg-surface-container text-primary font-medium">供应链部</span>
                      </div>
                      <span className="font-label-sm text-label-sm text-secondary flex items-center gap-0.5">
                        <span className="material-symbols-outlined text-[14px]">location_on</span>
                        上海青浦
                      </span>
                    </div>
                    <div className="flex items-center justify-between pt-1">
                      <h2 className="font-headline-sm text-headline-sm text-primary font-medium tracking-tight">海外供应链协同专员</h2>
                      <button className="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-primary" type="button">
                        <span className={`material-symbols-outlined text-[20px] transition-transform ${openJobs[3] ? '' : 'rotate-180'}`}>expand_less</span>
                      </button>
                    </div>
                    <p className="font-body-sm text-body-sm text-on-surface-variant">
                      专项培养：国际海运调度、跨国仓储配平与原料采购协同。
                    </p>
                  </div>

                  {openJobs[3] && (
                    <div className="px-space-md pb-space-md flex flex-col gap-space-md border-t border-surface-container pt-3">
                      <div className="flex flex-col gap-space-xs">
                        <div className="flex items-center gap-1.5">
                          <span className="w-1.5 h-1.5 rounded-full bg-primary"></span>
                          <h3 className="font-label-lg text-label-lg text-primary font-medium">培养方向</h3>
                        </div>
                        <p className="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
                          轮岗生产制造与品控检验，熟悉原木含水率、榫卯强度测试准则，配备业务导师1对1带教。
                        </p>
                      </div>
                      <div className="pt-space-xs flex flex-col gap-2">
                        <button
                          className="w-full py-3 px-space-md rounded-lg bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-sm"
                          onClick={() => showChannelNotice('海外供应链协同专员')}
                          type="button"
                        >
                          <span className="material-symbols-outlined text-[18px]">forward_to_inbox</span>
                          <span>申请该岗位意向</span>
                        </button>
                      </div>
                    </div>
                  )}
                </article>
              )}
            </section>

            {/* Mobile Perks */}
            <section className="px-margin-mobile pb-space-lg flex flex-col gap-space-sm">
              <div className="flex flex-col">
                <span className="font-label-sm text-label-sm text-secondary uppercase tracking-widest font-medium">Benefits &amp; Care</span>
                <h2 className="font-headline-sm text-headline-sm text-primary tracking-tight font-medium">馨心所向 · 伙伴关怀</h2>
              </div>
              <div className="grid grid-cols-2 gap-space-xs pt-1">
                <div className="p-space-sm rounded-xl bg-surface-container-lowest flex flex-col gap-1.5 shadow-sm">
                  <div className="w-7 h-7 rounded-lg bg-surface-container flex items-center justify-center text-primary">
                    <span className="material-symbols-outlined text-[18px]">health_and_safety</span>
                  </div>
                  <span className="font-label-lg text-label-lg text-primary font-medium">全面五险一金</span>
                  <span className="font-body-sm text-body-sm text-on-surface-variant">全额合规缴纳</span>
                </div>
                <div className="p-space-sm rounded-xl bg-surface-container-lowest flex flex-col gap-1.5 shadow-sm">
                  <div className="w-7 h-7 rounded-lg bg-surface-container flex items-center justify-center text-secondary">
                    <span className="material-symbols-outlined text-[18px]">beach_access</span>
                  </div>
                  <span className="font-label-lg text-label-lg text-primary font-medium">带薪年假</span>
                  <span className="font-body-sm text-body-sm text-on-surface-variant">平衡匠心与休整</span>
                </div>
                <div className="p-space-sm rounded-xl bg-surface-container-lowest flex flex-col gap-1.5 shadow-sm">
                  <div className="w-7 h-7 rounded-lg bg-surface-container flex items-center justify-center text-primary">
                    <span className="material-symbols-outlined text-[18px]">chair</span>
                  </div>
                  <span className="font-label-lg text-label-lg text-primary font-medium">专属家居内购</span>
                  <span className="font-body-sm text-body-sm text-on-surface-variant">自研家具特惠置家</span>
                </div>
                <div className="p-space-sm rounded-xl bg-surface-container-lowest flex flex-col gap-1.5 shadow-sm">
                  <div className="w-7 h-7 rounded-lg bg-surface-container flex items-center justify-center text-secondary">
                    <span className="material-symbols-outlined text-[18px]">featured_seasonal_and_gifts</span>
                  </div>
                  <span className="font-label-lg text-label-lg text-primary font-medium">节日暖心礼遇</span>
                  <span className="font-body-sm text-body-sm text-on-surface-variant">节庆定制原木礼包</span>
                </div>
              </div>
            </section>
          </main>

          {/* Toast Notification */}
          {toastNotice && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-[350px] p-space-sm rounded-xl bg-primary text-on-primary shadow-xl z-50 flex items-center gap-2 animate-bounce">
              <span className="material-symbols-outlined text-secondary-container text-[20px] flex-shrink-0">mark_email_read</span>
              <div className="flex flex-col min-w-0">
                <span className="font-label-md text-label-md font-medium text-surface-bright">{toastNotice}</span>
                <span className="font-label-sm text-label-sm text-on-primary-container truncate">正式申请通道建设中，敬请留意官方公告。</span>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Main App Component with MemoryRouter & Routes
    function App() {
      return (
        <MemoryRouter initialEntries={["/"]} initialIndex={0}>
          <Routes>
            <Route path="/" element={<HomePage />} />
            <Route path="/about-us" element={<AboutUsPage />} />
            <Route path="/join-us" element={<JoinUsPage />} />
            <Route path="/contact-us" element={<ContactUsPage />} />
            <Route path="/mobile" element={<MobileShowcasePage />} />
            <Route path="/mobile-join" element={<MobileJoinPage />} />
            {/* Fallback to Desktop Home */}
            <Route path="*" element={<HomePage />} />
          </Routes>
        </MemoryRouter>
      );
    }

    // Render App
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
